name: playbook365
description: Club Management App — Playbook365

publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.2.4
  google_fonts: ^8.0.2
  image_picker: ^1.1.2
  google_maps_flutter: ^2.12.0
  talkjs_flutter: ^0.17.5
  talkjs_flutter_inappwebview: any

  # UI helpers
  # cached_network_image: ^3.3.0
  # shimmer: ^3.0.0

  # Utils
  # intl: ^0.19.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - config/env.json
    - assets/svgs/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true

  # Uncomment and add font files under assets/fonts/ to use Inter
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Inter-ExtraBold.ttf
  #         weight: 800
